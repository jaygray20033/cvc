# CVC production stack. Runs from prebuilt images (no build:). Only proxy publishes ports.
#   docker compose --env-file .env -f infra/docker-compose.prod.yml run --rm migrate
#   docker compose --env-file .env -f infra/docker-compose.prod.yml up -d
# Secrets live in .env on the server (chmod 600), never in git.
name: cvc

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app-image: &app-image ${REGISTRY:-}cvc-api:${IMAGE_TAG:-latest}

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    networks: [cvc]

  web:
    image: ${REGISTRY:-}cvc-web:${IMAGE_TAG:-latest}
    env_file: ../.env
    logging: *logging
    restart: unless-stopped
    networks: [cvc]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: *app-image
    env_file: ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    networks: [cvc]
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: *app-image
    command: ['node', 'dist/worker.js']
    env_file: ../.env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    networks: [cvc]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # One-off: run BEFORE up. deploy.sh runs this and aborts on failure.
  migrate:
    image: *app-image
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    working_dir: /app
    env_file: ../.env
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ['tools']
    restart: 'no'
    logging: *logging
    networks: [cvc]

  # One-off production seed (admin/config/templates; real data in P3.12). Never demo data.
  seed:
    image: *app-image
    command: ['node_modules/.bin/prisma', 'db', 'seed']
    working_dir: /app
    env_file: ../.env
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ['tools']
    restart: 'no'
    logging: *logging
    networks: [cvc]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cvc}
      MYSQL_USER: ${MYSQL_USER:-cvc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *logging
    restart: unless-stopped
    networks: [cvc]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    logging: *logging
    restart: unless-stopped
    networks: [cvc]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ['/bin/sh', '/etc/seaweedfs/docker-entrypoint.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/docker-entrypoint.sh:/etc/seaweedfs/docker-entrypoint.sh:ro
    logging: *logging
    restart: unless-stopped
    networks: [cvc]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-off: create the S3 buckets. Runs on every up; safe to re-run (idempotent).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.53
    depends_on:
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./seaweedfs/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ['/bin/sh', '/init-buckets.sh']
    restart: 'no'
    logging: *logging
    networks: [cvc]

  # Optional antivirus. Enable with: --profile av
  clamav:
    image: clamav/clamav:1.4
    profiles: ['av']
    volumes:
      - clamav-data:/var/lib/clamav
    logging: *logging
    restart: unless-stopped
    networks: [cvc]

volumes:
  mysql-data:
  redis-data:
  seaweed-data:
  clamav-data:
  certs:

networks:
  cvc:
    driver: bridge
