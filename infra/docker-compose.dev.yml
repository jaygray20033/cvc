# CVC dev stack. Everything runs in Docker; the host only needs Docker + Git.
#   docker compose -f infra/docker-compose.dev.yml up -d
# Dev-only placeholder secrets below; production uses .env (never committed).
name: cvc-dev

x-api-env: &api-env
  NODE_ENV: development
  PORT: '3000'
  APP_URL: http://localhost:5180
  API_URL: http://localhost:3000
  DATABASE_URL: mysql://cvc:cvc@mysql:3306/cvc
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: dev-access-secret-change-me-please-32
  JWT_REFRESH_SECRET: dev-refresh-secret-change-me-please-32
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  ENCRYPTION_KEY: dev-encryption-key-change-me-please-32
  S3_ENDPOINT: http://seaweedfs:9000
  S3_REGION: us-east-1
  S3_BUCKET_PUBLIC: cvc-public
  S3_BUCKET_PRIVATE: cvc-private
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_USER: ''
  SMTP_PASS: ''
  EMAIL_FROM: 'CVC <no-reply@cvc.local>'
  npm_config_store_dir: /pnpm/store

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cvc
      MYSQL_USER: cvc
      MYSQL_PASSWORD: cvc
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init-dev.sql:/docker-entrypoint-initdb.d/init-dev.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ['/bin/sh', '/etc/seaweedfs/docker-entrypoint.sh']
    environment:
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports:
      - '9000:9000'
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/docker-entrypoint.sh:/etc/seaweedfs/docker-entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.53
    depends_on:
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./seaweedfs/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ['/bin/sh', '/init-buckets.sh']

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '8026:8025'
    restart: unless-stopped

  adminer:
    image: adminer:4
    ports:
      - '8082:8080'
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: cvc-api:dev
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    working_dir: /work
    command: ['pnpm', '--filter', 'api', 'start:dev']
    environment: *api-env
    ports:
      - '3000:3000'
    volumes:
      - ..:/work
      - root-node-modules:/work/node_modules
      - api-node-modules:/work/apps/api/node_modules
      - shared-node-modules:/work/packages/shared/node_modules
      - pnpm-store:/pnpm/store
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  worker:
    image: cvc-api:dev
    working_dir: /work
    command: ['pnpm', '--filter', 'api', 'exec', 'ts-node', '--transpile-only', 'src/worker.ts']
    environment: *api-env
    volumes:
      - ..:/work
      - root-node-modules:/work/node_modules
      - api-node-modules:/work/apps/api/node_modules
      - shared-node-modules:/work/packages/shared/node_modules
      - pnpm-store:/pnpm/store
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    image: cvc-web:dev
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: dev
    working_dir: /work
    command: ['pnpm', '--filter', 'web', 'dev', '--', '--host']
    environment:
      npm_config_store_dir: /pnpm/store
    ports:
      - '5180:5173'
    volumes:
      - ..:/work
      - root-node-modules:/work/node_modules
      - web-node-modules:/work/apps/web/node_modules
      - shared-node-modules:/work/packages/shared/node_modules
      - pnpm-store:/pnpm/store
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5173 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional antivirus (heavy image). Enable with: --profile av
  clamav:
    image: clamav/clamav:1.4
    profiles: ['av']
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  seaweed-data:
  clamav-data:
  root-node-modules:
  api-node-modules:
  web-node-modules:
  shared-node-modules:
  pnpm-store:
