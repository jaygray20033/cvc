name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cvc
          MYSQL_USER: cvc
          MYSQL_PASSWORD: cvc
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://cvc:cvc@localhost:3306/cvc
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-change-me-please-32
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me-please-32
      ENCRYPTION_KEY: ci-encryption-key-change-me-please-32
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET_PUBLIC: cvc-public
      S3_BUCKET_PRIVATE: cvc-private
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SMTP_HOST: localhost
      EMAIL_FROM: ci@cvc.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api prisma:deploy
      - run: pnpm test
      - run: pnpm build
      - name: OpenAPI drift check
        run: |
          pnpm gen:api
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/generated/schema.ts
