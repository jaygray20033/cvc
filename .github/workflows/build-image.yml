name: Build images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository }}/
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Derive image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          load: true
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.REGISTRY }}cvc-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          load: true
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.REGISTRY }}cvc-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (api)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}cvc-api:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy scan (web)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}cvc-web:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test (prod compose, test env)
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cat > .env <<'EOF'
          NODE_ENV=production
          PORT=3000
          APP_URL=http://localhost
          API_URL=http://localhost
          DATABASE_URL=mysql://cvc:cvc@mysql:3306/cvc
          REDIS_URL=redis://redis:6379
          JWT_ACCESS_SECRET=smoke-access-secret-change-me-please-32
          JWT_REFRESH_SECRET=smoke-refresh-secret-change-me-please-32
          ENCRYPTION_KEY=smoke-encryption-key-change-me-please-32
          S3_ENDPOINT=http://seaweedfs:9000
          S3_BUCKET_PUBLIC=cvc-public
          S3_BUCKET_PRIVATE=cvc-private
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          SMTP_HOST=mailpit
          EMAIL_FROM=smoke@cvc.local
          MYSQL_DATABASE=cvc
          MYSQL_USER=cvc
          MYSQL_PASSWORD=cvc
          MYSQL_ROOT_PASSWORD=root
          EOF
          docker compose --env-file .env -f infra/docker-compose.prod.yml up -d
          for i in $(seq 1 40); do
            if curl -fsS http://localhost/health && curl -fsS http://localhost/ready && curl -fsS http://localhost/ >/dev/null; then
              echo "smoke ok"; exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env -f infra/docker-compose.prod.yml logs
          exit 1

      - name: Export release tarball + checksum
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: bash infra/scripts/export-images.sh "${{ steps.meta.outputs.tag }}"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cvc-images-${{ steps.meta.outputs.tag }}
          path: |
            cvc-images-${{ steps.meta.outputs.tag }}.tar.gz
            cvc-images-${{ steps.meta.outputs.tag }}.tar.gz.sha256
